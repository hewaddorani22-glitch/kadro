name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not secrets: § 5 DDG requires this identity to be published, and it is
      # already visible on getkandro.com/impressum. The checks need it because
      # the legal pages are generated from it, and the release check refuses to
      # ship a build whose own privacy notice has no controller named.
      - name: Verify project
        env:
          EXPO_PUBLIC_LEGAL_PROVIDER_NAME: Hewad Dorani
          EXPO_PUBLIC_LEGAL_PROVIDER_ADDRESS: Altenessener Str. 124, 45326 Essen
          EXPO_PUBLIC_LEGAL_CONTACT_EMAIL: hewaddorani22@gmail.com
          EXPO_PUBLIC_LEGAL_PRIVACY_URL: https://getkandro.com/privacy
          EXPO_PUBLIC_LEGAL_TERMS_URL: https://getkandro.com/terms
          EXPO_PUBLIC_LEGAL_SUPPORT_URL: https://getkandro.com/support
        run: npm run verify
