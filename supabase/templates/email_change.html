<h2>Bestätige deine Kandro E-Mail-Adresse</h2>
<p>Gib diesen Code in Kandro ein:</p>
<p><strong>{{ .Token }}</strong></p>
<p>Alternativ kannst du deine E-Mail-Adresse über diesen Link bestätigen:</p>
<p><a href="{{ .ConfirmationURL }}">E-Mail-Adresse bestätigen</a></p>
<p>Wenn du diese Änderung nicht angefordert hast, kannst du diese Nachricht ignorieren.</p>
